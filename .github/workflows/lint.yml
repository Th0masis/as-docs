name: Lint & Format

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  lint:
    name: Ruff Lint
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install ruff
        run: pip install ruff
      
      - name: Lint with Ruff
        run: ruff check as_docs/ tests/ --output-format=github

  format:
    name: Ruff Format Check
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install ruff
        run: pip install ruff
      
      - name: Check formatting
        run: ruff format as_docs/ tests/ --check --diff

  type-check:
    name: Type Check (Pyright)
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install -e .
          pip install pyright
      
      - name: Run Pyright
        run: pyright as_docs/
